name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "install.sh"
      - "uninstall.sh"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # docs/index.html alone isn't enough — install.sh must be served from the
      # same Pages root, since the README's curl one-liner points at
      # https://yousafkhamza.github.io/accessrig/install.sh directly.
      - name: Stage Pages output
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp install.sh _site/install.sh
          cp uninstall.sh _site/uninstall.sh
          mkdir -p _site/scripts
          cp scripts/branding-proxy.sh _site/scripts/branding-proxy.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
